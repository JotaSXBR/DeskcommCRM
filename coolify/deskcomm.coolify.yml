# DeskcommCRM — template Coolify (1 service, compose raw em base64 via API).
# UPSTREAM_REF=1.28.0. Sem build na VPS, sem ports 80/443, sem caddy.
# Domínios via config do Coolify + set-fqdn no DB, nunca via label manual.
# Envs ${...} viram Environment Variables do Coolify; segredo nunca commitado.

services:
  app:
    image: ghcr.io/melgarafael/deskcommcrm:1.28.0
    pull_policy: always
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - NEXT_PUBLIC_ADMIN_URL=${NEXT_PUBLIC_ADMIN_URL}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - INTERNAL_CRON_SECRET=${INTERNAL_CRON_SECRET}
      - WAHA_API_BASE_URL=http://waha:3000
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_HMAC_SECRET=${WAHA_HMAC_SECRET}
      - WAHA_WEBHOOK_BASE_URL=${WAHA_WEBHOOK_BASE_URL}
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
      - AI_GATEWAY_API_KEY=${AI_GATEWAY_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
    depends_on:
      - srh
      - waha
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - internal
      - coolify

  worker:
    image: ghcr.io/melgarafael/deskcomm-worker:1.28.0
    pull_policy: always
    restart: unless-stopped
    environment:
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - WAHA_API_BASE_URL=http://waha:3000
      - WAHA_API_KEY=${WAHA_API_KEY}
      - AGENT_DISPATCH_CONSUMER=engine
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal

  waha:
    image: devlikeapro/waha:latest-2026.7.2
    restart: unless-stopped
    environment:
      - WAHA_API_KEY=sha512:${WAHA_API_KEY_SHA512}
      - WHATSAPP_HOOK_URL=${WAHA_WEBHOOK_BASE_URL}/api/v1/webhooks/waha
      - WHATSAPP_HOOK_EVENTS=message.any,message.ack,message.edited,message.revoked,session.status,state.change
      - WHATSAPP_HOOK_HMAC=${WAHA_HMAC_SECRET}
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      - WAHA_DASHBOARD_ENABLED=false
      - WHATSAPP_RESTART_ALL_SESSIONS=True
    volumes:
      - waha-data:/app/.sessions
      - waha-media:/app/.media
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - internal

  srh:
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    restart: unless-stopped
    environment:
      - SRH_MODE=env
      - SRH_TOKEN=${SRH_TOKEN}
      - SRH_CONNECTION_STRING=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  scheduler:
    image: ghcr.io/melgarafael/deskcomm-scheduler:1.28.0
    pull_policy: always
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      - TZ=UTC
      - INTERNAL_SECRET=${INTERNAL_SECRET}
    networks:
      - internal

volumes:
  waha-data:
  waha-media:

networks:
  internal:
    driver: bridge
  coolify:
    external: true
    name: ${TRAEFIK_NETWORK:-coolify}
